
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b16;
            color: white;
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #251044, #101020);
            text-align: center;
            padding: 45px 20px;
            border-bottom: 3px solid #8b5cf6;
        }

        header h1 {
            font-family: 'Press Start 2P', sans-serif;
            color: #a78bfa;
            font-size: 28px;
            line-height: 1.8;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #7c3aed;
        }

        header p {
            color: #c4b5fd;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .titulo-secao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .titulo-secao h2 {
            color: #a78bfa;
            font-size: 27px;
        }

        .titulo-secao p {
            color: #a1a1aa;
            margin-top: 8px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #a78bfa;
            transform: translateY(-2px);
        }

        .pesquisa {
            margin-bottom: 30px;
        }

        .pesquisa input {
            width: 100%;
            padding: 15px;
            border: 1px solid #383854;
            border-radius: 8px;
            background: #181829;
            color: white;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        .pesquisa input:focus {
            border-color: #a78bfa;
        }

        .listar-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .mensagem-vazia {
            grid-column: 1 / -1;
            text-align: center;
            color: #a1a1aa;
            padding: 70px 0;
            font-size: 18px;
        }

        .card-jogo {
            background: #181829;
            border: 1px solid #30304c;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card-jogo:hover {
            transform: translateY(-7px);
            border-color: #8b5cf6;
            box-shadow: 0 10px 25px #7c3aed30;
        }

        .capa {
            width: 100%;
            height: 240px;
            background: #25253b;
        }

        .capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-jogo {
            padding: 20px;
        }

        .info-jogo h3 {
            font-size: 19px;
            margin-bottom: 12px;
        }

        .info-jogo p {
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .preco {
            display: block;
            color: #4ade80;
            font-size: 23px;
            margin: 15px 0;
        }

        .btn-excluir {
            background: #dc2626;
            width: 100%;
        }

        .btn-excluir:hover {
            background: #ef4444;
        }

        /* MODAL DE CADASTRO */

        dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            background: #181829;
            color: white;
            border: 1px solid #8b5cf6;
            border-radius: 15px;
            box-shadow: 0 20px 60px #0009;
        }

        dialog:not([open]) {
            display: none;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        dialog h2 {
            text-align: center;
            color: #a78bfa;
            font-size: 22px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 14px;
            margin-bottom: 6px;
        }

        form input,
        form select {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #383854;
            border-radius: 7px;
            background: #101020;
            color: white;
            font-family: inherit;
            outline: none;
        }

        form input:focus,
        form select:focus {
            border-color: #a78bfa;
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .acoes button {
            flex: 1;
        }

        .cancelar {
            background: #3f3f46;
        }

        .cancelar:hover {
            background: #52525b;
        }

        footer {
            background: #101020;
            border-top: 1px solid #30304c;
            text-align: center;
            color: #a1a1aa;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 19px;
            }

            .titulo-secao {
                flex-direction: column;
                align-items: stretch;
            }

            .titulo-secao h2 {
                font-size: 23px;
            }

            .titulo-secao button {
                width: 100%;
            }

            .listar-jogos {
                grid-template-columns: 1fr;
            }

            dialog {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 RETRO GAME</h1>
        <p>Sua loja de jogos favoritos!</p>
    </header>

    <main class="container">

        <div class="titulo-secao">
            <div>
                <h2>Catálogo de Jogos</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button
                id="btnCadastrar"
                type="button"
                onclick="abrirCadastro()"
            >
                + Cadastrar Jogo
            </button>
        </div>

        <div class="pesquisa">
            <input
                type="search"
                id="pesquisarJogo"
                placeholder="🔎 Pesquisar jogo..."
                oninput="mostrarJogos()"
            >
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p class="mensagem-vazia">
                Nenhum jogo cadastrado 🎮
            </p>
        </section>

    </main>

    <!-- FORMULÁRIO DE CADASTRO -->

    <dialog id="modalCadastro">

        <h2>🎮 Cadastrar Novo Jogo</h2>

        <form id="formJogo" onsubmit="cadastrarJogo(event)">

            <label for="nome">Nome do Jogo</label>
            <input
                type="text"
                id="nome"
                placeholder="Ex: GTA San Andreas"
                required
            >

            <label for="plataforma">Plataforma</label>
            <select id="plataforma" required>
                <option value="">Selecione a plataforma</option>
                <option value="PlayStation 1">PlayStation 1</option>
                <option value="PlayStation 2">PlayStation 2</option>
                <option value="PlayStation 3">PlayStation 3</option>
                <option value="PlayStation 4">PlayStation 4</option>
                <option value="PlayStation 5">PlayStation 5</option>
                <option value="Xbox">Xbox</option>
                <option value="Xbox 360">Xbox 360</option>
                <option value="Nintendo">Nintendo</option>
                <option value="Super Nintendo">Super Nintendo</option>
                <option value="Mega Drive">Mega Drive</option>
                <option value="PC">PC</option>
            </select>

            <label for="genero">Gênero</label>
            <input
                type="text"
                id="genero"
                placeholder="Ex: Ação, Aventura, Corrida"
                required
            >

            <label for="imagem">URL da Imagem</label>
            <input
                type="url"
                id="imagem"
                placeholder="https://site.com/imagem.jpg"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                min="0.01"
                step="0.01"
                placeholder="Ex: 99.90"
                required
            >

            <div class="acoes">
                <button
                    type="button"
                    class="cancelar"
                    onclick="fecharCadastro()"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Salvar Jogo
                </button>
            </div>

        </form>
    </dialog>

    <footer>
        <p>© 2026 Retro Game - Todos os direitos reservados</p>
    </footer>

    <script>
        // ELEMENTOS DO SITE
        const modal = document.getElementById("modalCadastro");
        const form = document.getElementById("formJogo");
        const lista = document.getElementById("listarJogos");
        const pesquisarJogo = document.getElementById("pesquisarJogo");

        // RECUPERAR JOGOS SALVOS
        let jogos = [];

        try {
            jogos = JSON.parse(localStorage.getItem("jogosRetro")) || [];

            if (!Array.isArray(jogos)) {
                jogos = [];
            }
        } catch (erro) {
            jogos = [];
        }

        // ABRIR FORMULÁRIO
        function abrirCadastro() {
            modal.showModal();
        }

        // FECHAR FORMULÁRIO
        function fecharCadastro() {
            modal.close();
        }

        // CADASTRAR JOGO
        function cadastrarJogo(evento) {
            evento.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const plataforma = document.getElementById("plataforma").value;
            const genero = document.getElementById("genero").value.trim();
            const imagem = document.getElementById("imagem").value.trim();
            const preco = Number(document.getElementById("preco").value);

            if (!nome || !plataforma || !genero || !imagem || preco <= 0) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            const jogo = {
                id: Date.now(),
                nome: nome,
                plataforma: plataforma,
                genero: genero,
                imagem: imagem,
                preco: preco
            };

            jogos.push(jogo);

            salvarJogos();
            mostrarJogos();

            form.reset();
            fecharCadastro();

            alert("Jogo cadastrado com sucesso!");
        }

        // SALVAR NO NAVEGADOR
        function salvarJogos() {
            try {
                localStorage.setItem(
                    "jogosRetro",
                    JSON.stringify(jogos)
                );
            } catch (erro) {
                console.error("Erro ao salvar jogos:", erro);
                alert("O navegador não permitiu salvar os jogos.");
            }
        }

        // CRIAR CARD
        function criarCard(jogo) {
            const card = document.createElement("article");
            card.classList.add("card-jogo");

            const capa = document.createElement("div");
            capa.classList.add("capa");

            const imagemCapa = document.createElement("img");
            imagemCapa.src = jogo.imagem;
            imagemCapa.alt = "Capa do jogo " + jogo.nome;

            capa.appendChild(imagemCapa);

            const info = document.createElement("div");
            info.classList.add("info-jogo");

            const titulo = document.createElement("h3");
            titulo.textContent = jogo.nome;

            const nomePlataforma = document.createElement("p");
            nomePlataforma.textContent =
                "🎮 Plataforma: " + jogo.plataforma;

            const nomeGenero = document.createElement("p");
            nomeGenero.textContent =
                "🕹️ Gênero: " + jogo.genero;

            const valor = document.createElement("strong");
            valor.classList.add("preco");

            valor.textContent = Number(jogo.preco).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

            const btnExcluir = document.createElement("button");
            btnExcluir.classList.add("btn-excluir");
            btnExcluir.textContent = "Excluir Jogo";

            btnExcluir.addEventListener("click", () => {
                excluirJogo(jogo.id);
            });

            info.append(
                titulo,
                nomePlataforma,
                nomeGenero,
                valor,
                btnExcluir
            );

            card.append(capa, info);
            lista.appendChild(card);
        }

        // MOSTRAR JOGOS
        function mostrarJogos() {
            lista.innerHTML = "";

            const pesquisa = pesquisarJogo.value.toLowerCase().trim();

            const jogosFiltrados = jogos.filter((jogo) => {
                return jogo.nome.toLowerCase().includes(pesquisa);
            });

            if (jogosFiltrados.length === 0) {
                const mensagem = document.createElement("p");
                mensagem.classList.add("mensagem-vazia");

                mensagem.textContent = pesquisa
                    ? "Nenhum jogo encontrado."
                    : "Nenhum jogo cadastrado 🎮";

                lista.appendChild(mensagem);
                return;
            }

            jogosFiltrados.forEach((jogo) => {
                criarCard(jogo);
            });
        }

        // EXCLUIR JOGO
        function excluirJogo(id) {
            const confirmar = confirm(
                "Deseja realmente excluir este jogo?"
            );

            if (confirmar) {
                jogos = jogos.filter((jogo) => jogo.id !== id);

                salvarJogos();
                mostrarJogos();
            }
        }

        // CARREGAR JOGOS AO ABRIR O SITE
        mostrarJogos();
    </script>

</body>
</html>
