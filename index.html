
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Retro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Games Retro</h1>
        <p>Os clássicos dos videogames!</p>
    </header>

    <main class="container">

        <div class="titulo-secao">
            <div>
                <h2>Nosso Catálogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Jogo
            </button>
        </div>

        <section id="listarJogos" class="listarDiscos">
            <p id="mensagemVazia">
                Nenhum jogo cadastrado ainda
            </p>
        </section>

    </main>

    <dialog id="modalJogo">

        <h2 id="tituloModal">Novo Jogo</h2>

        <form id="formJogo">

            <label for="nome">Nome do jogo</label>
            <input type="text" id="nome" required>

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" required>

            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>

            <label for="imagem">URL da imagem do jogo</label>
            <input
                type="url"
                id="imagem"
                placeholder="https://site.com/capa.jpg"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                min="0.01"
                step="0.01"
                required
            >

            <div class="acoes">

                <button
                    type="button"
                    id="btnCancelar"
                    class="cancelar"
                >
                    Cancelar
                </button>

                <button type="submit" id="btnSalvar">
                    Salvar jogo
                </button>

            </div>

        </form>

    </dialog>

    <script src="script.js"></script>

</body>
</html>
