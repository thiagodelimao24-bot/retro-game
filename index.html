<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Retro Game | Catálogo</title>
  <style>
    :root { --fundo: #100b1d; --sup: #1b1230; --roxo: #9b6dff; --borda: #392750; }
    body { background: var(--fundo); color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #171025; border-bottom: 1px solid var(--borda); }
    .hero { text-align: center; padding: 50px 20px; background: radial-gradient(circle, #39225e 0%, var(--fundo) 80%); }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .topo-catalogo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    button { background: var(--roxo); border: none; padding: 10px 18px; color: #160c28; font-weight: bold; cursor: pointer; border-radius: 6px; }
    button:hover { opacity: 0.9; }
    input { background: var(--sup); border: 1px solid var(--borda); padding: 10px; color: #fff; border-radius: 6px; width: 250px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--sup); border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; padding: 15px; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .preco { color: #c4aaff; font-weight: bold; font-size: 18px; margin: 10px 0; }
    footer { text-align: center; padding: 20px; background: #171025; border-top: 1px solid var(--borda); margin-top: 40px; color: #b9abcf; font-size: 14px; }
    dialog { background: var(--sup); color: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 20px; width: 300px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    form input { width: 100%; }
  </style>
</head>
<body>

  <header>
    <h2>RETRO <span>GAME</span></h2>
    <button onclick="document.getElementById('modal').showModal()">+ Cadastrar jogo</button>
  </header>

  <section class="hero">
    <h1>Seu universo retrô</h1>
    <p>Reviva os clássicos dos videogames e descubra jogos inesquecíveis.</p>
  </section>

  <div class="container">
    <div class="topo-catalogo">
      <h3>Catálogo de Jogos</h3>
      <input type="text" id="busca" placeholder="Pesquisar jogo...">
    </div>

    <div id="catalogo" class="grid"></div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="form">
      <h3>Novo Jogo</h3>
      <input type="text" id="nome" placeholder="Nome do jogo" required>
      <input type="text" id="plat" placeholder="Plataforma" required>
      <input type="url" id="img" placeholder="URL da imagem da capa" required>
      <input type="number" id="preco" step="0.01" placeholder="Preço (R$)" required>
      <button type="button" onclick="salvar()">Salvar</button>
      <button type="button" onclick="document.getElementById('modal').close()">Cancelar</button>
    </form>
  </dialog>

  <footer>
    <p>© 2026 Retro Game — Todos os direitos reservados.</p>
  </footer>

  <script>
    let jogos = JSON.parse(localStorage.getItem('jogos')) || [
      { nome: "Super Mario World", plat: "Super Nintendo", img: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1wyy.jpg", preco: 59.90 },
      { nome: "Sonic the Hedgehog", plat: "Mega Drive", img: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1v7u.jpg", preco: 49.90 }
    ];

    const catalogo = document.getElementById('catalogo');
    const busca = document.getElementById('busca');

    function render(filtro = "") {
      catalogo.innerHTML = "";
      const lista = jogos.filter(j => j.nome.toLowerCase().includes(filtro.toLowerCase()));
      
      if(lista.length === 0) {
        catalogo.innerHTML = "<p>Nenhum jogo encontrado.</p>";
        return;
      }

      lista.forEach((j, index) => {
        catalogo.innerHTML += `
          <div class="card">
            <img src="${j.img}" alt="${j.nome}">
            <h3>${j.nome}</h3>
            <p>${j.plat}</p>
            <div class="preco">R$ ${Number(j.preco).toFixed(2)}</div>
            <button onclick="remover(${index})" style="background:#ffb5c4; color:#3b1728; width:100%;">Excluir</button>
          </div>
        `;
      });
    }

    function salvar() {
      const nome = document.getElementById('nome').value;
      const plat = document.getElementById('plat').value;
      const img = document.getElementById('img').value;
      const preco = document.getElementById('preco').value;

      if(!nome || !plat || !img || !preco) return alert('Preencha todos os campos!');

      jogos.push({ nome, plat, img, preco });
      localStorage.setItem('jogos', JSON.stringify(jogos));
      document.getElementById('modal').close();
      document.getElementById('form').reset();
      render();
    }

    function remover(index) {
      jogos.splice(index, 1);
      localStorage.setItem('jogos', JSON.stringify(jogos));
      render();
    }

    busca.addEventListener('input', (e) => render(e.target.value));
    render();
  </script>
</body>
</html>
