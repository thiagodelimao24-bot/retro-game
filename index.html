
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>🎮 RETRO GAME</h1>
        <p>Sua loja de jogos favoritos!</p>
    </header>

    <main class="container">

        <div class="titulo-secao">
            <div>
                <h2>Catálogo de Jogos</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button type="button" id="btnCadastrar">
                + Cadastrar Jogo
            </button>
        </div>

        <div class="pesquisa">
            <input
                type="search"
                id="pesquisarJogo"
                placeholder="🔎 Pesquisar jogo..."
            >
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p class="mensagem-vazia">
                Nenhum jogo cadastrado 🎮
            </p>
        </section>

    </main>

    <!-- JANELA DE CADASTRO -->

    <dialog id="modalCadastro">
        <h2>🎮 Cadastrar Novo Jogo</h2>

        <form id="formJogo">

            <label for="nome">Nome do Jogo</label>
            <input
                type="text"
                id="nome"
                placeholder="Ex: GTA San Andreas"
                required
            >

            <label for="plataforma">Plataforma</label>
            <select id="plataforma" required>
                <option value="">Selecione a plataforma</option>
                <option value="PlayStation 1">PlayStation 1</option>
                <option value="PlayStation 2">PlayStation 2</option>
                <option value="PlayStation 3">PlayStation 3</option>
                <option value="PlayStation 4">PlayStation 4</option>
                <option value="PlayStation 5">PlayStation 5</option>
                <option value="Xbox">Xbox</option>
                <option value="Xbox 360">Xbox 360</option>
                <option value="Nintendo">Nintendo</option>
                <option value="Super Nintendo">Super Nintendo</option>
                <option value="Mega Drive">Mega Drive</option>
                <option value="PC">PC</option>
            </select>

            <label for="genero">Gênero</label>
            <input
                type="text"
                id="genero"
                placeholder="Ex: Ação, Aventura, Corrida"
                required
            >

            <label for="imagem">URL da Imagem</label>
            <input
                type="url"
                id="imagem"
                placeholder="https://site.com/imagem.jpg"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                min="0.01"
                step="0.01"
                placeholder="99.90"
                required
            >

            <div class="acoes">
                <button
                    type="button"
                    id="btnCancelar"
                    class="cancelar"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Salvar Jogo
                </button>
            </div>

        </form>
    </dialog>

    <footer>
        <p>© 2026 Retro Game - Todos os direitos reservados</p>
    </footer>

</body>
</html>
